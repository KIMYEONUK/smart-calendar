name: smart_calendar
description: "SmartCalendar - OCR 기반 일정 관리 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  http: ^1.2.0
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.6.2

  # Network
  dio: ^5.7.0

  # Local storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Environment
  flutter_dotenv: ^5.2.1

  # Utils
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.19.0

  # Image & Camera
  image_picker: ^1.1.2

  # Calendar
  table_calendar: ^3.1.3

  # UUID
  uuid: ^4.5.1

  # URL Launcher
  url_launcher: ^6.3.1

  # SVG
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - .env
